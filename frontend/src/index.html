	</head><script>
		window.global = window;

			window.localStorage = {
				setItem: () => {},

			};


		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

		console.row = (color, type, action = '', label = '', ...columns) => {
			var formattedType = ' ' + type.padEnd(7)
			var string = ''
			var args = []
			
			string += '%c%s%c'
			args.push(`background: ${color}; color: #fff; border-radius: 2px;`, formattedType, '');
			
			string += ' %c%s%c';
			args.push('font-weight: bold', action, '');

			string += '%s%c%s%c  ';
			args.push(console.flex(50, formattedType + label + action), 'color: #ccc', label, '');


			columns.forEach((column) => {
				//string += '%c%s%c';
				string += '%O\t'
				args.push(column);
			})

			return [string, ...args]
		}

		console.labelObject = (object, label) => {
			const newObject = { ... object} 
			Object.defineProperty(newObject, Symbol.toStringTag, {
				value: label,
				enumerable: false
			})
			return newObject;
		}

		console.flex = (width, value) => {
			return (new Array(Math.max(0, width - value.length))).join(' ')
		}

		function track() {
			ga.apply(ga, arguments);
			if (arguments[1] === 'event') {
				if (window.Sentry) Sentry.addBreadcrumb({
					category: arguments[2],
					message: JSON.stringify(Array.prototype.slice.call(arguments, 2)),
					level: Sentry.Severity.Info
				});

				if (arguments[2] === 'Source') {
					ga(['_setCampSource', arguments[3]])
					ga(['_setCampName', arguments[4]])
				}  else if (arguments[2] == 'Email') {
					ga(['_setCampSource', 'Email'])
					ga(['_setCampName', arguments[3]])
				}
			}
			console.log(...console.row('rgb(84, 110, 122)', 'track ', arguments[0], arguments[1], ...Array.prototype.slice.call(arguments, 2)))

			if (window.fetchFromAPI) {
				if (arguments[1] === 'event') {
					return fetchFromAPI('/logs', {
						method: 'post',
						data: {
							type: 'event',
							category: arguments[2],
							action: arguments[3],
							label: arguments[4],
							value: arguments[5],
							uid: arguments[6],
						}
					})
				} else if (arguments[1] === 'pageview') {
					return fetchFromAPI('/logs', {
						method: 'post',
						data: {
							type: 'pageview',
							category: arguments[2].page,
							action: arguments[2].title,
						}
					})
				}
			}
			return Promise.resolve();
		}
		</script>

		height: 220px;

		animation-iteration-count: infinite;
		transition: transform .3s ease-in;
		-webkit-transition: -webkit-transform .3s ease-in;
		border-radius: 20px;
		overflow: hidden;
	}

	.spinning-loader.loaded {
		pointer-events: none;

		<script>
			try {
				const env =  window.NODE_ENV ||  'development';
				Sentry.init({
					dsn: window.SENTRY_DSN || null,
					environment: env,
					beforeSend(event) {
						if (!event.tags)
							event.tags = {};

						try {
							const user = JSON.parse(localStorage.user);
							if (user) {
								const {email, id, name}  = user;
								event.user = {email, id, name};
								event.tags.email = user.email;
							}
						} catch(e) {

						}
						if (env) {
							return event;
						}
					},
					integrations(integrations) {
						return integrations.filter(i => i.name !== 'TryCatch').map((i) => {
							if (i.name === 'Breadcrumbs') {
								return new Sentry.Integrations.Breadcrumbs({
									console: false
								})
							} else {
								return i;
							}
						});
					}
				});
				SentryStub.lazyErrors.map((e) => { Sentry.captureException(e) });
				window.removeEventListener('error', SentryStub.lazyOnError);
				window.removeEventListener('unhandledrejection', SentryStub.lazyOnError);
			} catch(e) {

			}
		</script>
